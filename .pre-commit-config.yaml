---
# Most pre-commit hooks are DISABLED by default in this template: they fight
# chezmoi's autoCommit/autoPush flow (every `chezmoi apply` that changes source
# state would trigger them) and need a toolchain on every clone. Enable the ones
# you want by uncommenting below, then run `pre-commit install`.
#
# The ONE exception is secret scanning (gitleaks), left ON deliberately: blocking
# secrets from being committed is something we want to be hard to do by accident.

repos:
  # Block secrets (API keys, tokens, private keys, ...) from being committed.
  # Deliberately active — do not comment this out. Bump with `pre-commit autoupdate`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

