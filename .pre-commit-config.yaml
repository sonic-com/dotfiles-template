---
# Pre-commit hooks are DISABLED by default in this template.
#
# Why: active hooks fight chezmoi's normal autoCommit/autoPush workflow (every
# `chezmoi apply` that changes source state would trigger them) and require
# `pre-commit install` plus the underlying tools (shellcheck, node, ...) on every
# clone. So they ship OFF. Enable the ones you want by uncommenting below, then
# run `pre-commit install`.

repos: []

